<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>আমার মজার মিডিয়া গ্যালারি</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
      --primary: #3b82f6; --accent: #10b981; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 20px; font-size: 1.5rem; color: var(--primary); }
    .card { background: var(--card); padding: 16px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    input, textarea, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #334155; background: #0b1120; color: #fff; font-size: 1rem; }
    button { background: var(--primary); border: none; font-weight: bold; cursor: pointer; }
    button:active { transform: scale(0.98); }
    .btn-danger { background: var(--danger); margin-top: 6px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 20px; }
    .media-card { background: var(--card); border-radius: 8px; overflow: hidden; padding: 10px; border: 1px solid #334155; }
    img, video { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; }
    .title { font-weight: bold; font-size: 0.95rem; margin: 6px 0; word-break: break-word; }
    .loader { text-align: center; color: #94a3b8; margin: 20px 0; }
  </style>
</head>
<body>

  <div class="container">
    <h1>আমার পার্সোনাল মিডিয়া গ্যালারি</h1>

    <!-- আপলোড ফর্ম -->
    <div class="card">
      <h3>নতুন ছবি বা ভিডিও যুক্ত করুন</h3>
      <form id="uploadForm">
        <input type="text" id="mediaTitle" required placeholder="ফাইলের নাম বা শিরোনাম..." maxlength="60" />
        <input type="file" id="mediaFile" required accept="image/*,video/mp4" />
        <button type="submit" id="submitBtn">গ্যালারিতে সেভ করুন</button>
      </form>
    </div>

    <!-- গ্যালারি সেকশন -->
    <h3>বন্ধুদের দেখানোর গ্যালারি</h3>
    <div id="loader" class="loader">মিডিয়া লোড হচ্ছে...</div>
    <div id="galleryGrid" class="grid"></div>
  </div>

  <!-- Firebase ও প্রজেক্টের মূল লজিক -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // আপনার দেওয়া ফায়ারবেস কনফিগারেশন এখানে অটো-সেট করা আছে
    const firebaseConfig = {
      apiKey: "AIzaSyBQ23-YFHEd2iutbcV8id5U-SwYVtwNdiI",
      authDomain: "my-media-gallery-e2fb9.firebaseapp.com",
      projectId: "my-media-gallery-e2fb9",
      storageBucket: "my-media-gallery-e2fb9.firebasestorage.app",
      messagingSenderId: "714937072251",
      appId: "1:714937072251:web:11e7e2afda18db152300de"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const uploadForm = document.getElementById("uploadForm");
    const galleryGrid = document.getElementById("galleryGrid");
    const loader = document.getElementById("loader");
    const submitBtn = document.getElementById("submitBtn");

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    uploadForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = document.getElementById("mediaTitle").value.trim();
      const fileInput = document.getElementById("mediaFile");
      const file = fileInput.files[0];

      if (!file) return alert("ফাইল সিলেক্ট করুন!");
      if (file.size > 10 * 1024 * 1024) {
        return alert("ফাইল সাইজ ১০ MB এর কম হতে হবে!");
      }

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = "আপলোড হচ্ছে, অপেক্ষা করুন...";
        
        const base64Url = await readFileAsDataURL(file);
        const isVideo = file.type.startsWith("video");

        await addDoc(collection(db, "media"), {
          title: title,
          url: base64Url,
          type: isVideo ? "video" : "image",
          createdAt: serverTimestamp()
        });

        alert("সফলভাবে গ্যালারিতে সেভ হয়েছে!");
        uploadForm.reset();
        loadGallery();
      } catch (err) {
        console.error(err);
        alert("আপলোড করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "গ্যালারিতে সেভ করুন";
      }
    });

    async function loadGallery() {
      try {
        loader.style.display = "block";
        galleryGrid.innerHTML = "";
        
        const q = query(collection(db, "media"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          galleryGrid.innerHTML = `<p style="color:#94a3b8">এখনো কোনো ফাইল নেই।</p>`;
          loader.style.display = "none";
          return;
        }

        querySnapshot.forEach((docSnap) => {
          const item = docSnap.data();
          const id = docSnap.id;
          const isVideo = item.type === "video";

          const mediaHtml = isVideo 
            ? `<video src="${item.url}" controls preload="metadata"></video>`
            : `<img src="${item.url}" alt="${item.title}" loading="lazy" />`;

          const div = document.createElement("div");
          div.className = "media-card";
          div.innerHTML = `
            ${mediaHtml}
            <div class="title">${item.title}</div>
            <button class="btn-danger" onclick="window.deleteItem('${id}')">মুছুন</button>
          `;
          galleryGrid.appendChild(div);
        });
      } catch (err) {
        console.error(err);
      } finally {
        loader.style.display = "none";
      }
    }

    window.deleteItem = async (id) => {
      if (confirm("সত্যিই ফাইলটি মুছে ফেলতে চান?")) {
        try {
          await deleteDoc(doc(db, "media", id));
          loadGallery();
        } catch (err) {
          alert("মুছে ফেলা সম্ভব হয়নি।");
        }
      }
    };

    loadGallery();
  </script>
</body>
  </html>
